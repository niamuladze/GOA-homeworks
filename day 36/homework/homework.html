<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple HTML Table</title>
  <style>
    body {
      background-color: #265C00; /* მწვანე ფონად */
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 90%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #a8d3e5;
      color: black;
    }

    td:nth-child(1) {
      background-color: #a1ff00;
      color: black;
    }

    td:nth-child(2) {
      background-color: #66b2ff;
      color: black;
    }

    td:nth-child(3) {
      background-color: #d4a017;
      color: black;
    }

    td:nth-child(4) {
      background-color: #c1440e;
      color: white;
    }

    td:nth-child(5) {
      background-color: #b30000;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Make Simple Table In <span style="color:red;">HTML</span></h1>

  <table>
    <tr>
      <th>S.R</th>
      <th>Name</th>
      <th>Address</th>
      <th>Number</th>
      <th>Country</th>
    </tr>
    <tr>
      <td>1</td>
      <td>John</td>
      <td>California</td>
      <td>745845</td>
      <td>USA</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Dain</td>
      <td>Barlin</td>
      <td>514254</td>
      <td>Germany</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Que</td>
      <td>New Delhi</td>
      <td>854874</td>
      <td>India</td>
    </tr>
    <tr>
      <td>4</td>
      <td>Tesla</td>
      <td>Karanchi</td>
      <td>658243</td>
      <td>Pakistan</td>
    </tr>
    <tr>
      <td>5</td>
      <td>Neil</td>
      <td>Dhaka</td>
      <td>658489</td>
      <td>Bangladesh</td>
    </tr>
  </table>

</body>
</html>
