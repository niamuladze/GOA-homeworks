<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ჩემი საყვარელი რეცეპტების საიტი</title>
</head>
<body>

    <h1>ჩემი საყვარელი რეცეპტების საიტი</h1>

    <!-- 1. ავტორიზაციის ფორმა -->
    <h2>ავტორიზაცია</h2>
    <form>
        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" name="surname"><br><br>

        <label for="email">ემაილი:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <input type="submit" value="შესვლა">
    </form>

    <!-- 2. ვიდეოები რეცეპტებთან დაკავშირებით -->
    <h2>ვიდეო რეცეპტები</h2>

    <video width="320" height="240" controls>
        <source src="Cooking - Sound Redesign using Foley.mp4">
        
    </video>

    <!-- 3. აუდიოები -->
    <h2>სამზარეულოს მუსიკა</h2>

    <audio controls>
        <source src="Cooking - Sound Redesign using Foley.mp3">
        
    </audio>

    <!-- 4. საყვარელი კერძის ინგრედიენტების ცხრილი -->
    <h2>ხაჭაპურის ინგრედიენტები</h2>
    <table border="1">
        <tr>
            <th>ინგრედიენტი</th>
            <th>რაოდენობა</th>
        </tr>
        <tr>
            <td>ფქვილი</td>
            <td>500 გრ</td>
        </tr>
        <tr>
            <td>წყალი</td>
            <td>200 მლ</td>
        </tr>
        <tr>
            <td>საფუარი</td>
            <td>1 ჩაის კოვზი</td>
        </tr>
        <tr>
            <td>მარილი</td>
            <td>1 ჩაის კოვზი</td>
        </tr>
        <tr>
            <td>ხაჭო</td>
            <td>400 გრ</td>
        </tr>
        <tr>
            <td>კვერცხი</td>
            <td>1 ცალი</td>
        </tr>
        <tr>
            <td>კარაქი</td>
            <td>30 გრ</td>
        </tr>
    </table>

</body>
</html>
