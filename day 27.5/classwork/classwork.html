<!DOCTYPE html>
<html lang="ka">
<head>

</head>
<body>

    <h1>ვიდეოები</h1>
    <video width="320" height="240" controls>
        <source src="Beyoncé - Chapter 03 LEVIIS JEANS.mp4">
    </video>

    <h1>აუდიოები</h1>
    <audio controls>
        <source src="Beyoncé - Chapter 03 LEVIIS JEANS.mp3">
    </audio>

    <h1>Source თეგსა და src ატრიბუტს შორის განსხვავება</h1>
    <p>
        <strong>source</strong> არის თეგი, რომელსაც ვიყენებთ <code>&lt;video&gt;</code> ან <code>&lt;audio&gt;</code> ელემენტებში, 
        რათა განვსაზღვროთ ფაილის წყარო. <br>
        <strong>src</strong> მიუთითებს ფაილის კონკრეტულ ბმულს.
    </p>

    <h1>ავტორიზაციის ფორმა</h1>
    <form>
        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" name="surname"><br><br>

        <label for="email">ემაილი:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <input type="submit" value="შესვლა">
    </form>

    <h1>Drop Down მენიუ - მანქანები</h1>
    <label for="cars">აირჩიეთ თქვენი საყვარელი მანქანა:</label><br>
    <select name="cars" id="cars">
        <option value="bmw">BMW</option>
        <option value="audi">Audi</option>
        <option value="tesla">Tesla</option>
        <option value="mercedes">Mercedes-Benz</option>
    </select>

</body>
</html>
